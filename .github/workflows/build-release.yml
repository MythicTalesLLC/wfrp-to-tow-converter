name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"       # triggers on version tags like v1.0.0
  workflow_dispatch:   # allow manual runs

jobs:
  # ─────────────────────────────────────────────────────────
  # macOS
  # ─────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Build .app bundle
        run: pyinstaller wfrp_tow_converter.spec --noconfirm

      - name: Zip .app
        run: |
          cd dist
          zip -r WFRP4e_to_TOW_Converter_mac.zip "WFRP4e to TOW Converter.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/WFRP4e_to_TOW_Converter_mac.zip

  # ─────────────────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Build .exe
        run: pyinstaller wfrp_tow_converter.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist\WFRP4e_to_TOW_Converter.exe

  # ─────────────────────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk
          pip install pyinstaller pillow

      - name: Build binary
        run: pyinstaller wfrp_tow_converter.spec --noconfirm

      - name: Package binary
        run: |
          cd dist
          tar -czf WFRP4e_to_TOW_Converter_linux.tar.gz WFRP4e_to_TOW_Converter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/WFRP4e_to_TOW_Converter_linux.tar.gz

  # ─────────────────────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## WFRP4e → The Old World Converter ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | macOS | `WFRP4e_to_TOW_Converter_mac.zip` — extract and run the .app |
            | Windows | `WFRP4e_to_TOW_Converter.exe` — run directly |
            | Linux | `WFRP4e_to_TOW_Converter_linux.tar.gz` — extract and run the binary |

            ### Requirements
            No Python installation required. Self-contained executables.
